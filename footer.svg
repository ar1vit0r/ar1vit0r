  </style>
  <rect width="900" height="70" fill="#070000"/>
  <line x1="20" y1="14" x2="880" y2="14" stroke="#ff2a2a" stroke-width="1" opacity="0.5"/>
  <g stroke="#ff2a2a" stroke-width="2" fill="none">
    <path d="M12 60 V68 H24"/><path d="M888 60 V68 H876"/>
  </g>
  <text class="mono" x="450" y="42" text-anchor="middle" fill="#c41e1e" font-size="13" letter-spacing="3">END OF TRANSMISSION  //  I'LL BE BACK<tspan class="blink" fill="#ff2a2a">_</tspan></text>
