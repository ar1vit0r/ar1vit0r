<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80" role="img" aria-label="End of line">
<style>.pulse{stroke-dasharray:14 260;animation:flow 3s linear infinite} .p2{animation-delay:1.2s} .led{animation:led 1.6s ease-in-out infinite} @keyframes flow{from{stroke-dashoffset:274}to{stroke-dashoffset:0}} @keyframes led{50%{opacity:.3}} text{font-family:'Courier New',Consolas,monospace} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
