<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="ar1vit0r, Python developer, data and backend. T-800 style HUD header">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .red  { fill: #ff2a2a; }
    .mid  { fill: #c41e1e; }
    .dim  { fill: #7a1414; }
    .name { font-size: 62px; font-weight: 700; letter-spacing: 8px; }
    .sub  { font-size: 16px; letter-spacing: 3px; }
    .sm   { font-size: 12px; letter-spacing: 2px; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    .sweep { animation: sweep 5s linear infinite; }
    .spin  { transform-origin: 790px 150px; animation: spin 14s linear infinite; }
    .spinr { transform-origin: 790px 150px; animation: spin 22s linear infinite reverse; }
    .tick  { animation: tick 30s linear infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes blink { to { visibility: hidden; } }
    @keyframes sweep { from { transform: translateY(-20px); } to { transform: translateY(320px); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes tick  { from { transform: translateX(0); } to { transform: translateX(-860px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ff2a2a" opacity="0.06"/>
    </pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#ff2a2a" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tickclip"><rect x="40" y="268" width="820" height="22"/></clipPath>
  </defs>

  <rect width="900" height="300" fill="#070000"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect width="900" height="300" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="900" height="16" fill="#ff2a2a" opacity="0.07"/>

  <!-- status bar -->
  <rect x="0" y="0" width="900" height="28" fill="#1a0000"/>
  <line x1="0" y1="28" x2="900" y2="28" stroke="#ff2a2a" stroke-width="1" opacity="0.6"/>
  <circle class="pulse" cx="22" cy="14" r="4" fill="#ff2a2a"/>
  <text class="mono red sm" x="34" y="18">SYS.ONLINE</text>
  <text class="mono dim sm" x="270" y="18">CYBERDYNE SYSTEMS // MODEL 101 // SERIES 800</text>
  <text class="mono red sm" x="800" y="18">NET: ACTIVE</text>

  <!-- frame corners -->
  <g stroke="#ff2a2a" stroke-width="2" fill="none">
    <path d="M12 52 V40 H24"/><path d="M876 40 H888 V52"/>
    <path d="M12 248 V260 H24"/><path d="M888 248 V260 H876"/>
  </g>

  <!-- reticle -->
  <g stroke="#ff2a2a" fill="none" stroke-width="1.5">
    <circle cx="790" cy="150" r="78" opacity="0.75"/>
    <circle cx="790" cy="150" r="52" opacity="0.4"/>
    <circle cx="790" cy="150" r="5" fill="#ff2a2a" filter="url(#glow)"/>
    <path d="M790 58 V100 M790 200 V242 M698 150 H740 M840 150 H882"/>
    <g class="spin"><path d="M790 62 A88 88 0 0 1 878 150" stroke-dasharray="6 10" opacity="0.9"/></g>
    <g class="spinr"><circle cx="790" cy="150" r="92" stroke-dasharray="2 9" opacity="0.5"/></g>
  </g>
  <text class="mono mid sm" x="728" y="254">TARGET ACQUIRED</text>

  <!-- identity -->
  <text class="mono dim sm" x="40" y="62">TARGET ID</text>
  <text class="mono red name" x="38" y="124" filter="url(#glow)">AR1VIT0R</text>
  <text class="mono red sub" x="42" y="156">PYTHON DEVELOPER // DATA &amp; BACKEND</text>
  <text class="mono mid sm" x="42" y="180">M.SC. COMPUTER SCIENCE, UFPEL  |  CAXIAS DO SUL, RS</text>

  <!-- readouts -->
  <g class="mono sm">
    <rect x="40"  y="204" width="196" height="26" fill="none" stroke="#ff2a2a" opacity="0.7"/>
    <text class="red" x="52"  y="221">PYTHON ..... PRIMARY</text>
    <rect x="248" y="204" width="196" height="26" fill="none" stroke="#ff2a2a" opacity="0.7"/>
    <text class="red" x="260" y="221">RAILS ...... ACTIVE</text>
    <rect x="456" y="204" width="196" height="26" fill="none" stroke="#ff2a2a" opacity="0.7"/>
    <text class="red" x="468" y="221">SQL / ETL .. ACTIVE</text>
  </g>

  <!-- ticker -->
  <line x1="40" y1="262" x2="860" y2="262" stroke="#ff2a2a" stroke-width="1" opacity="0.4"/>
  <g clip-path="url(#tickclip)">
    <g class="tick mono mid sm">
      <text x="40"  y="284" textLength="860" lengthAdjust="spacing">PYTHON  //  POSTGRESQL  //  DBT  //  RAILS 8  //  RUST  //  CI/CD  //  LLM EVALS  //  AI AGENTS  //  LANGGRAPH  //  </text>
      <text x="900" y="284" textLength="860" lengthAdjust="spacing">PYTHON  //  POSTGRESQL  //  DBT  //  RAILS 8  //  RUST  //  CI/CD  //  LLM EVALS  //  AI AGENTS  //  LANGGRAPH  //  </text>
    </g>
  </g>

  <rect width="900" height="300" fill="url(#vig)"/>
</svg>
