<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminator themed banner. T-800 CPU board header">
<style>text{font-family:'Courier New',Consolas,monospace} .si{fill:#a9b1b9} .red{fill:#ff2a2a} .silk{font-size:10px;letter-spacing:2px;fill:#4a5560}
.name{font-size:72px;font-weight:700;letter-spacing:10px} .sub{font-size:14px;letter-spacing:3px}
.pulse{stroke-dasharray:14 260;animation:flow 3s linear infinite} .p2{animation-delay:.8s;animation-duration:3.6s} .p3{animation-delay:1.6s;animation-duration:4.2s}
.led{animation:led 1.6s ease-in-out infinite} .cell{fill:#ff2a2a;opacity:.55;animation:cell 3s steps(1) infinite}
.core{transform-box:fill-box;transform-origin:bottom;fill:#ff2a2a;animation:core 2.4s ease-in-out infinite}
@keyframes flow{from{stroke-dashoffset:274}to{stroke-dashoffset:0}} @keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cell{0%{opacity:.15}35%{opacity:.8}70%{opacity:.3}} @keyframes core{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
