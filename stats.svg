<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="GitHub stats and top languages"><style>text{font-family:"Courier New",Consolas,monospace} .bar{transform-box:fill-box;transform-origin:left;animation:fill 1.4s ease-out backwards} .sweep{animation:sweep 5s linear infinite} .led{animation:led 1.6s ease-in-out infinite} @keyframes fill{from{transform:scaleX(0)}} @keyframes led{50%{opacity:.3}} @keyframes sweep{0%{transform:translateY(-14px);opacity:.1}100%{transform:translateY(200px);opacity:.1}} @media (prefers-reduced-motion: reduce){*{animation:none !important}}</style><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ff2a2a" stroke-opacity="0.07"/></pattern><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="560" height="200" rx="6" fill="#050607"/><rect width="560" height="200" fill="url(#grid)"/><rect width="560" height="200" rx="6" fill="none" stroke="#ff2a2a" stroke-opacity="0.35"/><rect class="sweep" width="560" height="14" fill="#ff2a2a" opacity="0"/><path d="M6 18V6H18 M542 6H554V18 M6 182V194H18 M542 194H554V182" fill="none" stroke="#ff2a2a" stroke-width="2"/><circle class="led" cx="26" cy="184" r="3" fill="#ff2a2a"/><text x="36" y="188" font-size="10" letter-spacing="2" fill="#68727c" fill-opacity="0.7">SCAN COMPLETE // PUBLIC DATA</text><text x="20" y="32" font-size="16" font-weight="700" letter-spacing="2" fill="#a9b1b9">GITHUB STATS</text><text x="290" y="32" font-size="16" font-weight="700" letter-spacing="2" fill="#a9b1b9">LANGUAGES BY REPO</text><line x1="20" y1="44" x2="540" y2="44" stroke="#ff2a2a" stroke-opacity="0.4"/><line x1="270" y1="56" x2="270" y2="170" stroke="#ff2a2a" stroke-opacity="0.25"/><text x="20" y="88" font-size="14" fill="#68727c">PUBLIC REPOS</tex